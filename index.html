<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flores amarillas para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nunito:wght@400;600&display=swap">
<style>
  /* Una sola pantalla negra: ramo de tres girasoles que crecen, dedicatoria debajo */
  :root {
    --bg: #000000;
    --petal: #ffd21f;
    --petal-tip: #ffe76a;
    --petal-back: #e9a400;
    --petal-edge: #b87500;
    --seed: #8b4513;
    --seed-dark: #3a1c08;
    --stem: #3f8f2f;
    --leaf: #4fae3a;
    --leaf-dark: #2c6e22;
    --ink: #fff6c8;
    --gold: #ffd700;
    --muted: #a39a6e;
    --font-script: "Dancing Script", "Brush Script MT", cursive;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    height: 100%;
    display: grid;
    grid-template-rows: 1fr auto;
    padding-inline: 16px;
    padding-block: 12px 20px;
    box-sizing: border-box;
  }
  canvas { width: 100%; height: 100%; display: block; cursor: pointer; min-height: 0; }
  .caption { display: grid; justify-items: center; gap: 10px; text-align: center; }
  .dedicatoria { display: grid; gap: 2px; justify-items: center; }
  .para {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    transition: opacity 1s ease;
  }
  h1 {
    margin: 0;
    font-family: var(--font-script);
    font-weight: 600;
    font-size: clamp(1.9rem, 7vw, 3.25rem);
    line-height: 1.15;
    color: var(--gold);
    text-wrap: balance;
    opacity: 0;
    transition: opacity 1.4s ease 0.6s;
  }
  .tq {
    margin: 4px 0 0;
    font-family: var(--font-script);
    font-weight: 600;
    font-size: clamp(1.3rem, 4.5vw, 1.9rem);
    color: var(--ink);
    opacity: 0;
    transition: opacity 1.4s ease 1.8s;
  }
  .dedicatoria.show .para, .dedicatoria.show h1, .dedicatoria.show .tq { opacity: 1; }
  button {
    font: 600 0.9rem var(--font-body);
    letter-spacing: 0.04em;
    color: var(--muted);
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--muted) 45%, transparent);
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }
  button:hover { color: var(--ink); border-color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>

<main class="stage">
  <canvas id="lienzo" aria-label="Tres girasoles amarillos creciendo sobre fondo negro, para Andrea"></canvas>
  <div class="caption">
    <div id="titulo" class="dedicatoria">
      <p class="para">Para Andrea</p>
      <h1>Flores amarillas para ti, mi Andy</h1>
      <p class="tq">Te quiero mucho, chaparra</p>
    </div>
    <button id="otra" type="button">Dibujar otra vez</button>
  </div>
</main>

<script>
  const canvas = document.getElementById("lienzo");
  const ctx = canvas.getContext("2d");
  const titulo = document.getElementById("titulo");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css = getComputedStyle(document.documentElement);
  const C = (n) => css.getPropertyValue(n).trim();
  const col = {
    petal: C("--petal"), tip: C("--petal-tip"), back: C("--petal-back"), edge: C("--petal-edge"),
    seed: C("--seed"), seedDark: C("--seed-dark"), stem: C("--stem"), leaf: C("--leaf"),
    leafDark: C("--leaf-dark"), bg: C("--bg"),
  };

  // Escena en un espacio virtual de 400 x 560 que se escala a cualquier pantalla
  const VW = 400, VH = 560;
  const PHI = 137.508 * Math.PI / 180;   // ángulo áureo, el mismo del script de Python

  const flores = [
    { bx: 125, hx: 95,  hy: 335, s: 0.62, bend: -30, inicio: 1300, fase: 1.7, hojas: [[0.55, -1]] },
    { bx: 285, hx: 312, hy: 300, s: 0.72, bend: 35,  inicio: 700,  fase: 0.6, hojas: [[0.5, 1]] },
    { bx: 200, hx: 200, hy: 175, s: 1,    bend: 22,  inicio: 0,    fase: 0,   hojas: [[0.45, -1], [0.68, 1]] },
  ];

  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const ease = (v) => { v = clamp01(v); return 1 - Math.pow(1 - v, 3); };
  const prog = (t, a, b) => ease((t - a) / (b - a));

  function puntoTallo(f, hx, hy, u) {
    // curva cuadrática desde el suelo hasta la cabeza
    const x0 = f.bx, y0 = VH, cx = (f.bx + hx) / 2 + f.bend, cy = (VH + hy) / 2;
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return [a * x0 + b * cx + c * hx, a * y0 + b * cy + c * hy];
  }

  function hoja(x, y, ang, largo, ancho, k) {
    if (k <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.scale(k, k);
    const g = ctx.createLinearGradient(0, 0, largo, 0);
    g.addColorStop(0, col.leafDark);
    g.addColorStop(1, col.leaf);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(largo * 0.3, -ancho, largo * 0.75, -ancho * 0.9, largo, 0);
    ctx.bezierCurveTo(largo * 0.75, ancho * 0.9, largo * 0.3, ancho, 0, 0);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(largo * 0.5, -ancho * 0.12, largo * 0.95, 0);
    ctx.strokeStyle = col.leafDark;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
  }

  function petalo(ang, base, largo, ancho, k, trasero) {
    if (k <= 0) return;
    ctx.save();
    ctx.rotate(ang);
    ctx.translate(0, -base);
    ctx.scale(0.4 + 0.6 * k, k);
    const g = ctx.createLinearGradient(0, 0, 0, -largo);
    g.addColorStop(0, trasero ? col.edge : col.back);
    g.addColorStop(0.35, trasero ? col.back : col.petal);
    g.addColorStop(1, trasero ? col.petal : col.tip);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(ancho, -largo * 0.25, ancho * 0.8, -largo * 0.8, 0, -largo);
    ctx.bezierCurveTo(-ancho * 0.8, -largo * 0.8, -ancho, -largo * 0.25, 0, 0);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = col.edge;
    ctx.lineWidth = 0.8;
    ctx.stroke();
    // nervio central
    ctx.beginPath();
    ctx.moveTo(0, -largo * 0.1);
    ctx.lineTo(0, -largo * 0.75);
    ctx.strokeStyle = trasero ? col.edge : col.back;
    ctx.globalAlpha = 0.5;
    ctx.stroke();
    ctx.restore();
  }

  function dibujarFlor(f, t, ahora) {
    const lt = t - f.inicio;
    if (lt <= 0) return true;
    const s = f.s;
    // balanceo suave con el viento
    const viento = reduceMotion ? 0 : Math.sin(ahora / 1300 + f.fase) * 4 * s;
    const hx = f.hx + viento, hy = f.hy + Math.abs(viento) * 0.15;

    // 1. tallo que crece desde el suelo
    const pt = prog(lt, 0, 900);
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const [x, y] = puntoTallo(f, hx, hy, (i / 40) * pt);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = col.stem;
    ctx.lineWidth = 7 * s;
    ctx.lineCap = "round";
    ctx.stroke();

    // 2. hojas
    for (const [u, lado] of f.hojas) {
      const k = prog(lt, 600 + u * 300, 1300 + u * 300);
      if (pt < u) continue;
      const [x, y] = puntoTallo(f, hx, hy, u);
      hoja(x, y, lado > 0 ? -0.45 : Math.PI + 0.45, 70 * s, 22 * s, k);
    }
    if (pt < 1) return false;

    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(viento * 0.01);
    const rc = 40 * s, largo = 66 * s, ancho = 15 * s, n = 22;

    // 3. pétalos: capa trasera y delantera, apareciendo en espiral
    for (let capa = 0; capa < 2; capa++) {
      for (let i = 0; i < n; i++) {
        const orden = capa * n + i;
        const k = prog(lt, 1000 + orden * 38, 1500 + orden * 38);
        const ang = (i + (capa ? 0 : 0.5)) * (Math.PI * 2 / n);
        petalo(ang, rc * 0.82, capa ? largo : largo * 1.08, capa ? ancho : ancho * 1.1, k, capa === 0);
      }
    }

    // 4. centro con semillas en espiral de Fibonacci (el algoritmo original)
    const kc = prog(lt, 1100, 1600);
    if (kc > 0) {
      ctx.beginPath();
      ctx.arc(0, 0, rc * kc, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rc);
      g.addColorStop(0, col.seedDark);
      g.addColorStop(1, col.seed);
      ctx.fillStyle = g;
      ctx.fill();
    }
    const semillas = 160;
    const paso = (rc * 0.93) / Math.sqrt(semillas);
    const visibles = Math.floor(semillas * prog(lt, 2300, 3700));
    for (let i = 0; i < visibles; i++) {
      const r = paso * Math.sqrt(i);
      const th = i * PHI;
      ctx.beginPath();
      ctx.arc(r * Math.cos(th), r * Math.sin(th), paso * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = i > 120 ? col.back : i > 35 ? col.seed : col.seedDark;
      ctx.fill();
    }
    ctx.restore();
    return lt > 3800;
  }

  let t0 = 0, anim = 0, terminado = false;

  function ajustar() {
    const dpr = window.devicePixelRatio || 1;
    const { width, height } = canvas.getBoundingClientRect();
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    if (reduceMotion) frame(performance.now());
  }

  function frame(ahora) {
    const t = reduceMotion ? 1e9 : ahora - t0;
    const w = canvas.width, h = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = col.bg;
    ctx.fillRect(0, 0, w, h);
    const esc = Math.min(w / VW, h / VH);
    ctx.translate((w - VW * esc) / 2, (h - VH * esc) / 2);
    ctx.scale(esc, esc);

    let listas = true;
    for (const f of flores) listas = dibujarFlor(f, t, ahora) && listas;
    if (listas && !terminado) { terminado = true; titulo.classList.add("show"); }
    if (!reduceMotion) anim = requestAnimationFrame(frame);
  }

  function empezar() {
    cancelAnimationFrame(anim);
    terminado = false;
    titulo.classList.remove("show");
    t0 = performance.now();
    frame(t0);
  }

  addEventListener("resize", ajustar);
  document.getElementById("otra").addEventListener("click", empezar);
  canvas.addEventListener("click", empezar);
  ajustar();
  empezar();
</script>
</body>
</html>
